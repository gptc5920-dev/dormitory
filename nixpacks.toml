providers = ["python"]

[variables]
YOLO_CONFIG_DIR = "/tmp/ultralytics"

[phases.setup]
aptPkgs = ["...", "build-essential", "pkg-config", "libmariadb-dev", "libgl1", "libglib2.0-0"]

[phases.install]
dependsOn = ["setup"]
paths = ["/opt/venv/bin"]
cmds = ['''
set -eu
python -m venv --copies /opt/venv
. /opt/venv/bin/activate
# Use the Apt headers and compiler together; Nix pkg-config may omit system paths.
export PKG_CONFIG_LIBDIR="/usr/lib/$(/usr/bin/gcc -dumpmachine)/pkgconfig:/usr/share/pkgconfig"
/usr/bin/pkg-config --exists libmariadb
export MYSQLCLIENT_CFLAGS="$(/usr/bin/pkg-config --cflags libmariadb)"
export MYSQLCLIENT_LDFLAGS="$(/usr/bin/pkg-config --libs libmariadb)"
export CC=/usr/bin/gcc
python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
python -m pip install -r requirements.txt
''']

[phases.build]
dependsOn = ["install"]
cmds = [
    "python -c 'import MySQLdb; import cv2; import torch'",
    "sed -i 's/\\r$//' entrypoint.sh",
]

[start]
cmd = "sh entrypoint.sh serve"
