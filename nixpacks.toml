providers = ["python"]

[variables]
YOLO_CONFIG_DIR = "/tmp/ultralytics"

[phases.setup]
# Nix Python needs runtime libraries on its own loader path as well as Apt headers.
nixLibs = ["...", "openssl", "libmysqlclient", "libGL", "glib", "xorg.libX11", "xorg.libXext", "xorg.libSM", "xorg.libICE"]
aptPkgs = ["...", "build-essential", "pkg-config", "libmariadb-dev", "libgl1", "libglib2.0-0"]

[phases.install]
dependsOn = ["setup"]
paths = ["/opt/venv/bin"]
cmds = ["sh nixpacks-install.sh"]

[phases.build]
dependsOn = ["install"]
cmds = [
    "python nixpacks-check.py",
    "sed -i 's/\\r$//' entrypoint.sh",
]

[start]
cmd = "sh entrypoint.sh serve"
